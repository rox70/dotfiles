# Optional AI tooling of this orchestrator, one entry per line (no alias = every child repo):
#   <add-on> [<alias> ...]                    built-in: openspec, openspec-cli, speckit,
#                                             mattpocock, superpowers
#   plugin <name>@<marketplace> [<alias> ...] any Claude Code plugin
#   marketplace <name> <source>               a plugin marketplace other than
#                                             claude-plugins-official (git URL, owner/repo, path)
# Every entry is reinstalled at its latest version by `make addons-sync`, which the
# devcontainer post-create runs on every (re)build. `make addon-<name>`, `make plugin` and
# `make marketplace` add entries here; delete a line to stop syncing it (already installed
# files and plugins are left in place).
